
# Verification automatique du projet Bullet Journal
name: Verification du projet Python

# Lance les verifications a chaque push ou pull request
on:
  push:
  pull_request:

# Liste des travaux a effectuer
jobs:
  verification:

    # GitHub utilise un ordinateur Linux
    runs-on: ubuntu-latest

    # Les etapes sont executees dans cet ordre
    steps:

      # Recupere les fichiers du projet sur GitHub
      - name: Recuperer le projet
        uses: actions/checkout@v4

      # Installe Python pour executer notre code
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installe les bibliotheques du requirements.txt
      - name: Installer les outils
        run: |
          python -m pip install -r requirements.txt

      # Verifie les regles de presentation du code Python
      - name: Verifier PEP 8
        run: pycodestyle bullet_journal tests

      # Verifie la documentation des fonctions et des classes
      - name: Verifier les docstrings
        run: pydocstyle --convention=google bullet_journal

      # Lance tous les tests du projet avec pytest
      - name: Executer les tests
        run: python -m pytest -v
